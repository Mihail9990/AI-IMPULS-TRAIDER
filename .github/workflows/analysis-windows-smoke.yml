name: Optional analysis Windows smoke

# Manual only. This workflow never reads LIVE configuration or starts MT5.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-analysis:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install the isolated analysis lock
        shell: pwsh
        run: |
          python -I tools/setup_analysis.py
          exit $LASTEXITCODE
      - name: Run real vendor calculations without a terminal
        shell: pwsh
        run: |
          ./.venv-analysis-313/Scripts/python.exe -I tools/check_analysis_dependencies.py --smoke --require-lock | Tee-Object analysis-windows-smoke.json
          exit $LASTEXITCODE
      - name: Check the isolated process clock without a terminal
        shell: pwsh
        run: |
          python -I tools/check_analysis_clock.py --worker-python ./.venv-analysis-313/Scripts/python.exe | Tee-Object analysis-windows-clock.json
          exit $LASTEXITCODE
      - name: Test analytics and read-only transport
        shell: pwsh
        run: |
          ./.venv-analysis-313/Scripts/python.exe -m unittest discover -s tests -p "test_analysis*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv-analysis-313/Scripts/python.exe -m unittest discover -s tests -p "test_tradfi_analysis_service.py" -v
          exit $LASTEXITCODE
      - name: Preserve the offline smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-windows-smoke
          path: |
            analysis-windows-smoke.json
            analysis-windows-clock.json
          if-no-files-found: ignore
