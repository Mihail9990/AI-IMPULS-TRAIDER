<!-- Mount only in the authenticated RECOVERY panel; call wireRecoveryRanges. -->
<form class="recovery-ranges" aria-label="Начальные триггеры RECOVERY">
  <label>Диапазонов
    <select name="range_count">
      <option value="1">Один</option>
      <option value="2">Два</option>
    </select>
  </label>
  <fieldset>
    <legend>Диапазон 1</legend>
    <label>Сторона
      <select name="side_1"><option>BUY</option><option>SELL</option></select>
    </label>
    <label>Цена открытия
      <input name="price_1" type="text" inputmode="decimal" autocomplete="off" required>
    </label>
  </fieldset>
  <fieldset data-range-second hidden>
    <legend>Диапазон 2</legend>
    <label>Сторона
      <select name="side_2" disabled><option>BUY</option><option>SELL</option></select>
    </label>
    <label>Цена открытия
      <input name="price_2" type="text" inputmode="decimal" autocomplete="off" disabled>
    </label>
  </fieldset>
  <button name="send_ranges" type="submit" disabled>Подтвердить и отправить</button>
  <button name="check_ranges" type="button">Проверить состояние</button>
  <output data-range-status role="status" aria-live="polite"></output>
</form>
