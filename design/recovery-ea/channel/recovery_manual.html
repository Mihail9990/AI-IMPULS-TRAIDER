<section class="recovery-manual" aria-label="Ручное ожидание RECOVERY">
  <p>Позицию или триггер-ордер выставляешь сам в MT5.</p>
  <button type="button" data-action="manual_wait" disabled>Ожидай ручную позицию</button>
  <button type="button" data-action="manual_pending_wait" disabled>Ожидай триггер ордер и выставь SL</button>
  <button type="button" data-action="manual_cancel" disabled hidden>Отменить ожидание</button>
  <p data-cancel-note hidden>Отмена отключает только ожидание. Ордер и SL остаются в MT5.</p>
  <button type="button" data-manual-check>Проверить состояние</button>
  <output data-manual-status role="status" aria-live="polite"></output>
</section>
