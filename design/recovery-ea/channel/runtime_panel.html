<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RECOVERY</title>
  <link rel="stylesheet" href="/recovery/assets/runtime_panel.css">
  <script type="module" src="/recovery/assets/runtime_panel.mjs"></script>
</head>
<body>
  <main>
    <h1>RECOVERY</h1>
    <section id="login">
      <form id="login-form" autocomplete="off">
        <label for="panel-key">Ключ панели</label>
        <input id="panel-key" type="password" required autocomplete="off">
        <button type="submit">Войти</button>
      </form>
    </section>
    <section id="panel" hidden>
      <button type="button" id="logout">Выйти</button>
      <!-- RANGE_FORM -->
    </section>
    <p id="session-result" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
